[project]
name = "stock-scraper"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "resend>=2.48.0",
    "yfinance>=1.7.0",
]

[project.scripts]
stock-scraper = "stock_scraper:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
]

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
