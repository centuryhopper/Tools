[project]
name = "news-scraper"
version = "0.1.0"
description = "Saves daily US top headlines from NewsAPI to a multi-sheet Excel file on a cron schedule"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "newsapi-python>=0.2.7",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "python-dotenv>=1.0",
]
