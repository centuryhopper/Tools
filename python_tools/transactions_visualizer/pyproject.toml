[project]
name = "transactions-visualizer"
version = "0.1.0"
description = "Streamlit application for visualizing transaction data"
authors = [{ name = "centuryhopper", email = "leotheasianlion@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "pyspark>=4.1.1,<5.0.0",
  "streamlit>=1.57.0,<2.0.0",
  "plotly>=6.7.0,<7.0.0",
  "pandas>=2.0.0",
  "pyarrow>=15.0.0",
]

[dependency-groups]
dev = ["ipykernel>=7.2.0,<8.0.0"]
