[project]
name = "cppgen-cli"
version = "0.1.2"
description = "A lightweight C++ project generator that creates a clean, reusable CMake-based C++ project structure."
authors = [{ name = "Leo Zhang", email = "leotheasianlion@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["cpp", "cmake", "generator", "cli", "template"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

dependencies = ["typer>=0.25.1,<0.26.0", "jinja2>=3.1.6,<4.0.0"]

[project.scripts]
cppgen = "cppgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cppgen"]

# Take this folder from my source tree and put it inside the installed package.
#[tool.hatch.build.targets.wheel.force-include]
#"src/cppgen/templates" = "cppgen/templates"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=7.0.0",
]
