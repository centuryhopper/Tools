<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airplane Cabin Noise</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css">
<style>
  :root, [data-bs-theme="light"] {
    --bs-primary: #3b6ea5;
    --bs-primary-rgb: 59, 110, 165;
    --accent-soft: #dbe6f2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  [data-bs-theme="dark"] {
    --bs-primary: #6fa2d8;
    --bs-primary-rgb: 111, 162, 216;
    --accent-soft: #263447;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  
  html, body { 
    /*
      lets the body's box actually grow taller than the 
      viewport when its content needs more room, instead of 
      staying pinned to viewport height and centering into 
      negative space
    */
    min-height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px 16px;
  }
  .app-card { max-width: 380px; width: 100%; }
  .play-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    font-size: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 8px var(--accent-soft);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .play-btn:active { transform: scale(0.94); }
  .play-btn.playing { box-shadow: 0 0 0 8px rgba(var(--bs-primary-rgb), 0.25); }
  .eq-name { width: 38px; flex-shrink: 0; }
  .eq-val { width: 42px; flex-shrink: 0; text-align: right; color: var(--bs-secondary-color); }
  .eq-section-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--bs-secondary-color);
    margin-top: 0.85rem;
    margin-bottom: 0.4rem;
  }
  .eq-section-label:first-child { margin-top: 0.2rem; }
  #eqToggle .caret { display: inline-block; transition: transform 0.15s ease; }
  #eqToggle.open .caret { transform: rotate(180deg); }
  .status { min-height: 16px; }
</style>
</head>
<body class="p-5">
<script>
  (function () {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var applyTheme = function () {
      document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
    };
    applyTheme();
    mq.addEventListener('change', applyTheme);
  })();
</script>

<div class="card app-card shadow-sm border-0 rounded-4 text-center">
  <div class="card-body p-4">
    <div class="fs-1 mb-1">✈️</div>
    <h1 class="h5 fw-semibold mb-1">Airplane Cabin Noise</h1>
    <p class="text-secondary small mb-4">Deep engine rumble for sleep &amp; focus</p>

    <button type="button" class="btn btn-primary play-btn mx-auto mb-4" id="playBtn" aria-label="Play">▶</button>

    <div class="mb-3 text-start">
      <label class="d-flex justify-content-between small text-secondary mb-1" for="volume">
        <span>Volume</span><span id="volVal">70%</span>
      </label>
      <input type="range" class="form-range" id="volume" min="0" max="100" value="70">
    </div>

    <div class="mb-3 text-start">
      <label class="d-flex justify-content-between small text-secondary mb-1" for="rumble">
        <span>Rumble depth</span><span id="rumbleVal"></span>
      </label>
      <input type="range" class="form-range" id="rumble" min="0" max="100" value="55">
    </div>

    <div class="btn-group w-100" role="group" aria-label="Presets">
      <input type="radio" class="btn-check preset-btn" name="preset" id="preset-takeoff" data-preset="takeoff" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="preset-takeoff">Takeoff</label>

      <input type="radio" class="btn-check preset-btn" name="preset" id="preset-cruise" data-preset="cruise" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="preset-cruise">Cruise</label>

      <input type="radio" class="btn-check preset-btn" name="preset" id="preset-prop" data-preset="prop" autocomplete="off">
      <label class="btn btn-outline-primary btn-sm" for="preset-prop">Prop plane</label>
    </div>

    <button type="button" class="btn btn-link btn-sm text-decoration-none w-100 mt-3 d-flex align-items-center justify-content-center gap-1 fw-semibold"
      id="eqToggle" data-bs-toggle="collapse" data-bs-target="#eqPanel" aria-expanded="false" aria-controls="eqPanel">
      <span>Equalizer</span><span class="caret">▾</span>
    </button>

    <div class="collapse text-start" id="eqPanel">
      <div class="pt-1">

        <div class="eq-section-label">Bass</div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Low</span>
          <input type="range" class="form-range flex-grow-1" id="eqBassLow" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqBassLowVal">-12dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Mid</span>
          <input type="range" class="form-range flex-grow-1" id="eqBassMid" min="-12" max="12" value="0" step="1">
          <span class="eq-val small" id="eqBassMidVal">0dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">High</span>
          <input type="range" class="form-range flex-grow-1" id="eqBassHigh" min="-12" max="12" value="0" step="1">
          <span class="eq-val small" id="eqBassHighVal">0dB</span>
        </div>

        <div class="eq-section-label">Mids</div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Low</span>
          <input type="range" class="form-range flex-grow-1" id="eqMidLow" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqMidLowVal">-12dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Mid</span>
          <input type="range" class="form-range flex-grow-1" id="eqMid" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqMidVal">-12dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">High</span>
          <input type="range" class="form-range flex-grow-1" id="eqMidHigh" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqMidHighVal">-12dB</span>
        </div>

        <div class="eq-section-label">Treble</div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Low</span>
          <input type="range" class="form-range flex-grow-1" id="eqTrebleLow" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqTrebleLowVal">-12dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="eq-name small">Mid</span>
          <input type="range" class="form-range flex-grow-1" id="eqTrebleMid" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqTrebleMidVal">-12dB</span>
        </div>
        <div class="d-flex align-items-center gap-2 mb-3">
          <span class="eq-name small">High</span>
          <input type="range" class="form-range flex-grow-1" id="eqTrebleHigh" min="-12" max="12" value="-12" step="1">
          <span class="eq-val small" id="eqTrebleHighVal">-12dB</span>
        </div>

        <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2" id="eqReset">Reset EQ</button>
      </div>
    </div>

    <div class="mt-3 small text-secondary">
      Auto-stop:
      <select class="form-select form-select-sm d-inline-block w-auto ms-1" id="timer">
        <option value="0">Off</option>
        <option value="900">15 min</option>
        <option value="1800">30 min</option>
        <option value="3600">1 hour</option>
        <option value="10800">3 hours</option>
      </select>
    </div>

    <div class="status mt-3 small text-secondary" id="status"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
</body>
</html>
